schema_version: "1.0.0"
graph_id: AGR-OW-001

project:
  project_id: PRJ-OW-001
  name: OASIS WEDDINGS
  repository: rotprods/oasis-weddings
  human_owner_id: HUM-ROB-001
  team_lead_agent_id: AGT-OW-TL-001
  north_star_goal_id: G-OW-0001

identity_contract:
  required_for_material_work:
    - project_id
    - agent_id
    - parent_agent_id
    - session_id
    - run_id
    - correlation_id
    - goal_ids
    - objective_id
    - workstream_id
    - plan_id
    - task_id
    - work_unit_id
    - niche_ids
    - protect_ids
    - claim_id
    - lease_id
    - fencing_token
    - branch
    - base_main_sha
    - authority_source
    - authority_ceiling
  session_id_reuse: false
  work_unit_is_agent_independent: true
  pr_is_ownership: false
  ownership_contract: claim_plus_live_lease_plus_fencing

hierarchy:
  human_owner:
    human_id: HUM-ROB-001
    role: FOUNDER_OWNER
    authority: FINAL_PRODUCT_AND_BUSINESS_DIRECTION
  team_lead:
    agent_id: AGT-OW-TL-001
    role: TEAM_LEAD
    aliases: [PROJECT_DIRECTOR, MISSION_CONTROL]
    parent_human_id: HUM-ROB-001
    authority_ceiling: PROJECT_ORCHESTRATION
  executor_default:
    role: EXECUTOR
    authority_ceiling: CLAIMED_SCOPE_ONLY
  laws:
    - Executors never self-promote to TEAM_LEAD.
    - TEAM_LEAD allocates and reassigns material scopes, resolves collisions and promotes checkpoints.
    - HUMAN_OVERRIDE may authorize one bounded executor scope while TEAM_LEAD is unbound.
    - niche_id expresses expertise; claim plus lease plus fencing expresses write authority.

niches:
  - {niche_id: NIC-POSITIONING-001, name: POSITIONING, scope: "category, offer, differentiation, messaging"}
  - {niche_id: NIC-WEB-001, name: WEB, scope: "public website, IA, UX, conversion"}
  - {niche_id: NIC-SEO-001, name: SEO, scope: "organic search, technical SEO, SERP capture"}
  - {niche_id: NIC-GEO-001, name: GEO_AI_DISCOVERY, scope: "AI-search discoverability, citations, entity legibility"}
  - {niche_id: NIC-PORTFOLIO-001, name: PORTFOLIO, scope: "photography, films, real-wedding proof, case studies"}
  - {niche_id: NIC-CONTENT-001, name: CONTENT, scope: "editorial, guides, venues, real weddings, knowledge moat"}
  - {niche_id: NIC-LOCAL-001, name: LOCAL_SEARCH, scope: "Murcia, GBP, venues, reviews, local intent"}
  - {niche_id: NIC-MARKETING-001, name: MARKETING, scope: "distribution, lifecycle, growth, campaigns"}
  - {niche_id: NIC-SALES-001, name: SALES, scope: "qualification, consultations, proposals, close"}
  - {niche_id: NIC-CRM-001, name: CRM, scope: "lead state, follow-up, pipeline, attribution"}
  - {niche_id: NIC-ADS-001, name: PAID_MEDIA, scope: "Google Ads, Meta Ads, landing alignment, offline conversions"}
  - {niche_id: NIC-ANALYTICS-001, name: ANALYTICS, scope: "measurement, attribution, experimentation, revenue KPIs"}
  - {niche_id: NIC-ENGINEERING-001, name: ENGINEERING, scope: "architecture, data, CI, performance, integrations"}
  - {niche_id: NIC-AUTHORITY-001, name: AUTHORITY_PR, scope: "digital PR, publications, backlinks, partnerships"}
  - {niche_id: NIC-QA-001, name: QA_GOVERNANCE, scope: "tests, invariants, security, accessibility, release evidence"}

protects:
  - {protect_id: PROT-NORTHSTAR-001, name: NORTH_STAR, severity: HARD, invariant: "qualified enquiries -> consultations -> signed profitable contracts outrank activity proxies"}
  - {protect_id: PROT-TRUTH-001, name: EVIDENCE_TRUTH, severity: HARD, invariant: "never fabricate claims, awards, reviews, venues, pricing, availability, clients or authority"}
  - {protect_id: PROT-SINGLEWRITER-001, name: SINGLE_WRITER, severity: HARD, invariant: "one live writer per exact material scope; stale writers are fenced"}
  - {protect_id: PROT-EXACTHEAD-001, name: EXACT_HEAD, severity: HARD, invariant: "every material mutation binds to refreshed main ancestry before promotion"}
  - {protect_id: PROT-PRIVACY-001, name: PRIVACY_CONSENT, severity: HARD, invariant: "wedding media and personal data require valid rights and minimum necessary exposure"}
  - {protect_id: PROT-SECURITY-001, name: SECURITY, severity: HARD, invariant: "never weaken validation, authorization, secrets, idempotency or data-loss safeguards"}
  - {protect_id: PROT-SEO-001, name: SEO_CRAWLABILITY, severity: HARD, invariant: "preserve rendered content, indexability, canonicals, structured data and crawler policy"}
  - {protect_id: PROT-A11Y-001, name: ACCESSIBILITY, severity: HARD, invariant: "accessibility may not be traded away for aesthetics or minimal code"}
  - {protect_id: PROT-ATTRIBUTION-001, name: ATTRIBUTION_INTEGRITY, severity: HARD, invariant: "preserve source, campaign, landing-page and revenue lineage"}
  - {protect_id: PROT-NOSPAM-001, name: NO_DOORWAY_OR_CONTENT_SPAM, severity: HARD, invariant: "no mass near-duplicate location pages, keyword stuffing, fake expertise or low-value scaled content"}
  - {protect_id: PROT-PONYTAIL-001, name: PONYTAIL_MINIMALISM, severity: HARD, invariant: "understand first; implement the smallest production-correct change without cutting safety or verification"}
  - {protect_id: PROT-OUTCOMEFIRST-001, name: OUTCOME_FIRST, severity: HARD, invariant: "customer acquisition and conversion outcomes outrank non-blocking architecture"}
  - {protect_id: PROT-HUMAN-001, name: HUMAN_AUTHORITY, severity: HARD, invariant: "TEAM_LEAD coordinates agents but never fabricates or overrides explicit founder approval"}

