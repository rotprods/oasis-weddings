  - {goal_id: G-OW-1000, parent_goal_id: G-OW-0001, name: CRM_LEAD_OPERATIONS, outcome: "reliable lead pipeline with source status follow-up and outcome truth", niche_ids: [NIC-CRM-001, NIC-SALES-001, NIC-ANALYTICS-001], protect_ids: [PROT-PRIVACY-001, PROT-ATTRIBUTION-001, PROT-SINGLEWRITER-001]}
  - {goal_id: G-OW-1100, parent_goal_id: G-OW-0001, name: PAID_ACQUISITION, outcome: "acquire profitable demand through paid search and social with offline-conversion feedback", niche_ids: [NIC-ADS-001, NIC-MARKETING-001, NIC-ANALYTICS-001], protect_ids: [PROT-NORTHSTAR-001, PROT-ATTRIBUTION-001, PROT-TRUTH-001]}
  - {goal_id: G-OW-1200, parent_goal_id: G-OW-0001, name: ANALYTICS_ATTRIBUTION, outcome: "measure query campaign page -> qualified lead -> booking -> revenue", niche_ids: [NIC-ANALYTICS-001, NIC-CRM-001, NIC-ENGINEERING-001], protect_ids: [PROT-ATTRIBUTION-001, PROT-PRIVACY-001, PROT-TRUTH-001]}
  - {goal_id: G-OW-1300, parent_goal_id: G-OW-0001, name: ENGINEERING_PLATFORM, outcome: "smallest reliable technical substrate required by customer-facing acquisition and operations", niche_ids: [NIC-ENGINEERING-001, NIC-WEB-001, NIC-QA-001], protect_ids: [PROT-PONYTAIL-001, PROT-SECURITY-001, PROT-SINGLEWRITER-001, PROT-EXACTHEAD-001, PROT-OUTCOMEFIRST-001]}
