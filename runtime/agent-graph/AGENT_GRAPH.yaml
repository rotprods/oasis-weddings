    protect_ids: [PROT-NORTHSTAR-001, PROT-TRUTH-001, PROT-OUTCOMEFIRST-001, PROT-HUMAN-001]
  - {goal_id: G-OW-0100, parent_goal_id: G-OW-0001, name: POSITIONING_AND_OFFER, outcome: "differentiated evidence-backed positioning and offer architecture", niche_ids: [NIC-POSITIONING-001, NIC-MARKETING-001, NIC-SALES-001], protect_ids: [PROT-TRUTH-001, PROT-NORTHSTAR-001]}
  - {goal_id: G-OW-0200, parent_goal_id: G-OW-0001, name: WEB_CONVERSION_PRODUCT, outcome: "premium fast indexable website converting couples into availability enquiries", niche_ids: [NIC-WEB-001, NIC-ENGINEERING-001, NIC-QA-001], protect_ids: [PROT-SEO-001, PROT-A11Y-001, PROT-SECURITY-001, PROT-PONYTAIL-001, PROT-ATTRIBUTION-001]}
  - {goal_id: G-OW-0300, parent_goal_id: G-OW-0001, name: SEO_ORGANIC_DEMAND, outcome: "capture high-intent non-brand organic demand with useful evidence-backed pages", niche_ids: [NIC-SEO-001, NIC-CONTENT-001, NIC-WEB-001], protect_ids: [PROT-SEO-001, PROT-NOSPAM-001, PROT-TRUTH-001]}
