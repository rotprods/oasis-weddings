  - {goal_id: G-OW-0500, parent_goal_id: G-OW-0001, name: PORTFOLIO_PROOF, outcome: "turn real photography and films into permissioned proof connected to weddings venues and services", niche_ids: [NIC-PORTFOLIO-001, NIC-WEB-001, NIC-CONTENT-001], protect_ids: [PROT-PRIVACY-001, PROT-TRUTH-001, PROT-SEO-001]}
